<div class="auth-page">
  <div class="auth-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <div class="auth-card animate-fade-in-scale">
    <div class="auth-header">
      <div class="auth-logo">🧙</div>
      <h1 class="auth-title">Crie sua <span>Personagem</span></h1>
      <p class="auth-subtitle">Escolha sua classe e comece a aventura</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <label>Nome da Personagem</label>
        <input
          type="text"
          class="form-control"
          formControlName="displayName"
          placeholder="Ex: Mago das Estimativas"
        />
      </div>

      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          class="form-control"
          formControlName="email"
          placeholder="heroi@guilda.com"
        />
      </div>

      <div class="form-group">
        <label>Senha</label>
        <div class="input-group">
          <input
            [type]="showPassword() ? 'text' : 'password'"
            class="form-control"
            formControlName="password"
            placeholder="Mínimo 6 caracteres"
          />
          <button type="button" class="input-toggle" (click)="showPassword.set(!showPassword())">
            {{ showPassword() ? '🙈' : '👁️' }}
          </button>
        </div>
      </div>

      <div class="form-group">
        <label>Classe da Personagem</label>
        <div class="class-grid">
          @for (cls of classes; track cls.key) {
            <button
              type="button"
              class="class-card"
              [class.selected]="form.value.characterClass === cls.key"
              [style.--class-color]="cls.color"
              (click)="selectClass(cls.key)"
            >
              <span class="class-icon">{{ cls.icon }}</span>
              <span class="class-name">{{ cls.name }}</span>
              <span class="class-desc">{{ cls.description }}</span>
            </button>
          }
        </div>
      </div>

      <button type="submit" class="btn btn-gold btn-lg w-full" [disabled]="form.invalid || loading()">
        @if (!loading()) {
          <span>✨ Criar Personagem</span>
        } @else {
          <span class="spinner"></span>
        }
      </button>
    </form>

    <p class="auth-link">Já tem conta? <a routerLink="/auth/login">Entrar na guilda →</a></p>
  </div>
</div>
