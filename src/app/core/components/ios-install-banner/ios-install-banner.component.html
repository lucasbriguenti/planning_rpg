@if (visible()) {
  <div class="ios-banner animate-fade-in-up">
    <div class="ios-banner-body">
      <div class="ios-banner-icon">⚔️</div>
      <div class="ios-banner-text">
        <strong>Instale o Planning RPG</strong>
        <span>
          Toque em
          <svg class="share-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
            <polyline points="16 6 12 2 8 6"/>
            <line x1="12" y1="2" x2="12" y2="15"/>
          </svg>
          e depois <em>"Adicionar à Tela de Início"</em>
        </span>
      </div>
      <button class="ios-banner-close" (click)="dismiss()" aria-label="Fechar">✕</button>
    </div>
    <div class="ios-banner-arrow" aria-hidden="true">▼</div>
  </div>
}
