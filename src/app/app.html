<div class="app-wrapper">
  <!-- Navigation -->
  @if (!isAuthPage) {
    <nav class="navbar">
      <a class="navbar-brand" routerLink="/dashboard">
        <span class="brand-icon">⚔️</span>
        <span class="brand-name">Planning<span class="brand-rpg">RPG</span></span>
      </a>

      <button class="menu-toggle btn btn-icon btn-ghost" (click)="isMenuOpen = !isMenuOpen">
        {{ isMenuOpen ? '✕' : '☰' }}
      </button>

      <div class="navbar-links" [class.open]="isMenuOpen">
        <a routerLink="/dashboard" routerLinkActive="active" class="nav-link" (click)="isMenuOpen = false">🏰 Início</a>
        <a routerLink="/sessions/new" class="nav-link" (click)="isMenuOpen = false">⚔️ Nova Sessão</a>
        <a routerLink="/leaderboard" routerLinkActive="active" class="nav-link" (click)="isMenuOpen = false">🏆 Ranking</a>
        @if (currentUser) {
          <hr class="mobile-nav-divider">
          <a routerLink="/profile" class="nav-link mobile-nav-btn" (click)="isMenuOpen = false">👤 Meu Perfil</a>
          <button class="btn btn-ghost btn-sm mobile-nav-btn" (click)="themeService.toggle(); isMenuOpen = false">
            {{ themeService.isDark() ? '☀️ Tema Claro' : '🌙 Tema Escuro' }}
          </button>
          <button class="btn btn-ghost btn-sm mobile-nav-btn" (click)="logout(); isMenuOpen = false">🚪 Sair</button>
        }
      </div>

      @if (currentUser) {
        <div class="navbar-user">
          <div class="user-xp">
            <span class="xp-level">Nv.{{ currentUser.level }}</span>
            <div class="xp-mini-bar">
              <div class="xp-fill" [style.width.%]="xpPercentage"></div>
            </div>
          </div>
          <a routerLink="/profile" class="user-profile-chip">
            <span class="avatar avatar-sm">{{ charIcon }}</span>
            <span class="user-profile-name">{{ currentUser.displayName }}</span>
          </a>
          <button class="btn btn-icon btn-ghost" (click)="themeService.toggle()" [title]="themeService.isDark() ? 'Tema claro' : 'Tema escuro'">
            {{ themeService.isDark() ? '☀️' : '🌙' }}
          </button>
          <button class="btn btn-ghost btn-sm navbar-logout-desktop" (click)="logout()">🚪 Sair</button>
        </div>
      }
    </nav>
  }

  <!-- Main content -->
  <main class="main-content" [class.auth-layout]="isAuthPage">
    <router-outlet />
  </main>

  <!-- iOS PWA install banner -->
  <app-ios-install-banner />

  <!-- Toast notifications -->
  <div class="toast-container">
    @for (n of notifications; track n.id) {
      <div class="toast toast-{{ n.type }} animate-fade-in-up" (click)="dismissNotification(n.id)">
        <div class="toast-title">{{ n.title }}</div>
        <div class="toast-message">{{ n.message }}</div>
      </div>
    }
  </div>
</div>
